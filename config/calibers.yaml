# ============================================================
# 取数参数 —— 分析时「各周期拉多少根 K 线」
#
# 就两个夹子，**没有任何口径公式**。
# 行情怎么算、该看什么，交给 AI 自己从 K 线里读。
#
# ★ 2026-10-11：**「其余周期」那张表删掉了**。
#   用户：「只给当前周期的前 100 根数据」→「1. 不拉了」——
#   分析现在**只取主周期一个周期**（最近 100 根逐根喂给 AI），
#   所以「其余周期怎么跟着取」那张表已经没有意义，删掉免得骗人。
#
# 改完即时生效（每次分析重新读本文件），不用改代码、不用重启。
#
# 主周期（你在图上看的那个）按「看最近多少天」换算根数，
# 但**至少 200 根**：100 根发给 AI + 前面 100 根只用来当「量比」的基准。
# ============================================================

取数:
  # 换算结果夹在这个区间里：
  #   · 少于「最少根数」用它兜底（日线只给 3 天就是 3 根，看不出东西）
  #   · 多于「最多根数」就截断（15m 拉 60 天要 5760 根，拉不动）
  最少根数: 30
  最多根数: 1500
