# ============================================================
# 取数参数 —— 分析时「各周期拉多少根 K 线」
#
# 就这一张表 + 两个夹子，**没有任何口径公式**。
# 行情怎么算、该看什么，交给 AI 自己从 K 线里读（跟知识库收录时同一套做法）。
#
# 改完即时生效（每次分析重新读本文件），不用改代码、不用重启。
#
# 主周期（你在图上看的那个）**不看这张表**：它按你填的「看最近多少天」换算根数。
# 这张表管的是**其余周期**怎么跟着取。
# ============================================================

取数:
  其余周期:
    # 主周期是 1h  →  15m 给 2 天、4h 给 30 天、1d 给 60 天
    1h: {15m: 2, 4h: 30, 1d: 60}

    # 主周期是 15m →  1h 给 10 天、4h 给 20 天、1d 给 30 天
    15m: {1h: 10, 4h: 20, 1d: 30}

    # 主周期是 4h  →  日线给 60 天（不取 15m/1h，看不出东西还占篇幅）
    4h: {1d: 60}

    # 主周期是日线 → 不再取别的周期
    1d: {}

  # 换算结果夹在这个区间里：
  #   · 少于「最少根数」用它兜底（日线只给 3 天就是 3 根，看不出东西）
  #   · 多于「最多根数」就截断（15m 拉 60 天要 5760 根，拉不动）
  最少根数: 30
  最多根数: 1500
