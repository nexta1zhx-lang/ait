# 生产部署：app + db 一站起。
#
#   cp .env.example .env        # 改掉 PGPASSWORD（见 docs/DEPLOY.md）
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 与根目录的 docker-compose.yml 的区别：那份只起 db，给本地开发用；
# 这份是「代码 + 数据库」整套，线上用这一份。
#
# ⚠️ name 必须显式写：目录名是中文（预测），compose 推导不出项目名。

name: crypto-advisor

services:
  db:
    image: postgres:16-alpine
    container_name: ca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-ca}
      # ⚠️ 上线前务必在 .env 里改掉，别用默认的本地密码
      POSTGRES_PASSWORD: ${PGPASSWORD:-ca_local_dev}
      POSTGRES_DB: ${PGDATABASE:-crypto_advisor}
      # 中文排序 / 大小写处理
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    # 内存相关参数：2026-10-07 从 909MB 那档换到 $12 档（2GB / 2vCPU / 60GB）后重调。
    #   · shared_buffers 64MB → **384MB**
    #     （旧值是按 909MB 机器定的；那台 `buffers_backend` 涨到 418 万，即后端频繁自己刷盘）
    #   · effective_cache_size → **1536MB** 显式写死
    #     ⚠️ 它**不占内存**，只是「告诉规划器大概有多少缓存可用」。Postgres 的**默认值是
    #        4GB** —— 在 909MB 的机器上等于谎报，规划器以为索引都住缓存里、偏好索引扫描，
    #        实测那台的 PSI `io full` 长期 37%。这台 2GB，写 1.5GB 比较贴合。
    # max_connections 20 不动：应用侧 pg 连接池上限 10，够用。
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=20
    volumes:
      - ca-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${PGUSER:-ca} -d ${PGDATABASE:-crypto_advisor}'
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ca-app
    restart: unless-stopped
    # environment 的优先级高于 env_file，所以 .env 里本地的
    # PGHOST=localhost / PGPORT=5432 在这里被覆盖成容器内的 db
    environment:
      PGHOST: db
      PGPORT: 5432
      NODE_ENV: production
      PORT: 8787
    env_file:
      - .env
    volumes:
      # ⚠️ 2026-10-04：`./.env:/app/.env` 那个挂载**去掉了** ——
      # 应用不再往 `.env` 写东西（大模型配置改成按用户存数据库，
      # 在网页「我的 → 模型配置」里填）。env_file 照样把变量喂进来。
      # 顺带没有「首次 up 前 .env 必须存在，否则 Docker 会建成目录」那个坑了。
      # 下载目录（APK + releases.json）—— `/api/downloads` 要读里面的
      # 真实文件（大小 / md5），「下载」页就是拿这块数据渲染的。
      # 线上 `/dl/*` 本身由 caddy 发，不走本进程；这里只读，不写。
      # ⚠️ 两边必须挂**同一个宿主机目录**，不然页面上列的和实际能下的对不上。
      - ./downloads:/app/downloads:ro
      # 「服务器监测」页要看宿主机上有哪些容器（2026-10-05 加）——
      # 容器里的 `docker` CLI 靠这个 socket 连宿主机 daemon。
      # ⚠️⚠️ 这等于把本容器的权限提到**宿主机 root 那一档**：socket 是读写通道，
      #      `:ro` 只是表明意图（挡不住 `docker stop/rm/exec` 这类 API 调用）。
      #      当时的权衡：自用单管理员、三个容器都在同一套 compose 里，
      #      而且应用本来就攥着交易所只读 key 和大模型 key —— 边际风险可接受。
      #      以后要给别的东西开这个容器，先把这条拿掉。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # 只监听本机，方便在服务器上 curl 调试；对外一律走 Caddy。
      - '127.0.0.1:8787:8787'
    depends_on:
      db:
        condition: service_healthy

  # 反向代理 + 自动 HTTPS。证书存在卷里，重启不会重新申请。
  # 域名与路由写在根目录的 Caddyfile 里。
  caddy:
    image: caddy:2-alpine
    container_name: ca-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 下载目录（APK 等）—— 对应 Caddyfile 里的 /dl/* 路由
      - ./downloads:/srv/dl:ro
      - ca-caddy-data:/data
      - ca-caddy-config:/config
    # 让 Caddy 能反代到宿主机上的服务（如 Netdata 装在宿主机时）
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - app

  # ---------------------------------------------------------------- 监控（可选）
  # 起法：docker compose -f docker-compose.prod.yml --profile monitor up -d
  # 首次打开会要求你创建管理员账号，所以不会像裸奔的日志面板那样被人翻。
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: ca-uptime-kuma
    restart: unless-stopped
    profiles: ['monitor']
    volumes:
      - ca-uptime-kuma:/app/data

volumes:
  ca-pgdata:
    name: ca-pgdata
  ca-caddy-data:
    name: ca-caddy-data
  ca-caddy-config:
    name: ca-caddy-config
  ca-uptime-kuma:
    name: ca-uptime-kuma
