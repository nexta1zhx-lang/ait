<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover 是**必须的**：打包成 App 后 WebView 铺满整屏，
      不写这一条，`env(safe-area-inset-*)` 会**恒为 0**，
      现有的底部导航安全区（style.css 的 --tabbar-h 那段）就白做了。

      `maximum-scale=1, user-scalable=no`（2026-10-07 用户：「移动端不要让双指撮合等手势生效」）：
      挡住浏览器的**捏合缩放**（整页被放大之后回不来，密密麻麻的可点区域全错位）。
      ⚠️ 光靠这一条**不够**：iOS Safari 从 10 起就忽略 `user-scalable=no`（无障碍考虑），
         真正干活的是 style.css 里那两条 `touch-action: pan-x pan-y`（iOS 13+ 支持）。
         这条留着是给 Android Chrome / 老 WebView 兜底。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!--
      theme-color：浏览器 / PWA 顶栏和「添加到主屏幕」后的状态栏取这个色。
      ⚠️ 它要跟**手机上的**页面主背景一致：窄屏（≤900px）整页铺的是
         `style.css` 里 `panel` 那个变量（#121316），所以这里写 121316 而不是
         更暗那档 `bg`（#08090b）—— 否则手机上状态栏和页面顶部就是两个色。
         （Android 侧的同一组值见 `android/app/src/main/res/values/colors.xml` 的
         `app_shell`。）
    -->
    <meta name="theme-color" content="#121316" />
    <meta name="color-scheme" content="dark" />
    <!-- 标签页图标：跟 App 图标同一套，由 `scripts/make-icons.py` 生成 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- 「添加到主屏幕」后全屏运行（PWA / iOS 独立模式） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Ait" />
    <!-- 首屏标题：原来这里是「用量与花费」，明显是复制残留，路由会覆盖但会闪一下 -->
    <title>Ait</title>
  </head>
  <body>
    <div id="app"></div>

    <!--
      ★ 2026-10-17：**JS 没跑起来时的兜底页**。

      用户报：「APP 常驻在后台，但一打开直接黑屏，什么内容都没有」。
      原生那一层（`MainActivity`）已经接管了「页面根本拉不下来」和「渲染进程被杀」两种；
      这一块管**第三种**：HTML 拿到了、脚本也跑了，但**挂载之前就出错了**
      （比如某个模块初始化时抛错）—— 那样 `#app` 一直是空的，body 又是深色底，
      屏幕上就是一片黑，而且**永远不动**。

      所以：脚本起不来 / 12 秒还没挂载 ⇒ 把这块露出来，给一句人话 + 一个「重新加载」。
      ⚠️ 必须是**内联**的（这段要能在所有 bundle 都挂掉时还活着），样式也内联。
      ⚠️ 别把它做成默认可见：正常启动时它一直是 `hidden`（挂载成功后 `main.ts` 会
         主动删掉它，连 DOM 都不留）。
    -->
    <div id="boot-fallback" hidden>
      <div class="bf-box">
        <h1>页面没起来</h1>
        <p class="bf-msg" id="boot-fallback-msg">
          界面脚本没加载成功 —— 多半是网络刚断了一下。
        </p>
        <button type="button" onclick="location.reload()">重新加载</button>
      </div>
    </div>
    <style>
      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #121316;
        color: #e8eaf0;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif;
        text-align: center;
      }
      #boot-fallback[hidden] {
        display: none;
      }
      #boot-fallback h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      #boot-fallback .bf-msg {
        color: #8b949e;
        font-size: 13px;
        margin: 0 0 18px;
        word-break: break-word;
      }
      #boot-fallback button {
        font: inherit;
        font-size: 14px;
        padding: 9px 22px;
        border-radius: 8px;
        border: 1px solid #2e3540;
        background: #1b1f26;
        color: #e8eaf0;
      }
    </style>
    <script>
      /*
       * 看门狗：12 秒还没挂载就把兜底页露出来。
       * `main.ts` 挂成功后会 `window.__caBooted = true` 并把这块整个删掉。
       */
      ;(function () {
        var shown = false
        function show(msg) {
          if (shown) return
          shown = true
          var el = document.getElementById('boot-fallback')
          if (!el) return
          if (msg) {
            var m = document.getElementById('boot-fallback-msg')
            if (m) m.textContent = msg
          }
          el.hidden = false
        }
        window.__caBoot = show
        window.setTimeout(function () {
          if (!window.__caBooted) show()
        }, 12000)
        /* 脚本层面的错（模块 404 / 语法错 / 初始化抛错）也当场露出来，别等 12 秒 */
        window.addEventListener('error', function (e) {
          if (window.__caBooted) return
          var t = e && e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            show('界面文件没下载下来 —— 网络断了，或者刚发过版。')
            return
          }
          var msg = e && e.message ? String(e.message) : ''
          show(msg ? '界面脚本报错：' + msg.slice(0, 120) : '')
        }, true)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
