<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover 是**必须的**：打包成 App 后 WebView 铺满整屏，
      不写这一条，`env(safe-area-inset-*)` 会**恒为 0**，
      现有的底部导航安全区（style.css 的 --tabbar-h 那段）就白做了。

      `maximum-scale=1, user-scalable=no`（2026-10-07 用户：「移动端不要让双指撮合等手势生效」）：
      挡住浏览器的**捏合缩放**（整页被放大之后回不来，密密麻麻的可点区域全错位）。
      ⚠️ 光靠这一条**不够**：iOS Safari 从 10 起就忽略 `user-scalable=no`（无障碍考虑），
         真正干活的是 style.css 里那两条 `touch-action: pan-x pan-y`（iOS 13+ 支持）。
         这条留着是给 Android Chrome / 老 WebView 兜底。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!--
      theme-color：浏览器 / PWA 顶栏和「添加到主屏幕」后的状态栏取这个色。
      ⚠️ 它要跟**手机上的**页面主背景一致：窄屏（≤900px）整页铺的是
         `style.css` 里 `panel` 那个变量（#121316），所以这里写 121316 而不是
         更暗那档 `bg`（#08090b）—— 否则手机上状态栏和页面顶部就是两个色。
         （Android 侧的同一组值见 `android/app/src/main/res/values/colors.xml` 的
         `app_shell`。）
    -->
    <meta name="theme-color" content="#121316" />
    <meta name="color-scheme" content="dark" />
    <!-- 标签页图标：跟 App 图标同一套，由 `scripts/make-icons.py` 生成 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- 「添加到主屏幕」后全屏运行（PWA / iOS 独立模式） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Ait" />
    <!-- 首屏标题：原来这里是「用量与花费」，明显是复制残留，路由会覆盖但会闪一下 -->
    <title>Ait</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
